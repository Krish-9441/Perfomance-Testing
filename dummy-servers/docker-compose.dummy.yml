services:
  cpu-hog:
    build: 
      context: ./cpu-hog
    ports:
      - "3001:3000" # Maps port 3001 on your laptop to port 3000 inside the container
    
  memory-leaker:
    build:
      context: ./memory-leaker
    ports:
      - "3002:3000"
  
  socket-hoarder:
    build:
      context: ./socket-hoarder
    ports:
      - "3003:3000"

  sluggish-io:
    build:
      context: ./sluggish-io
    ports:
      - "3004:3000"
